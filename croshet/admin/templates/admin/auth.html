<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access</title>
  <style>
    :root {
      --pink: #e86f8f;
      --pink-dark: #b94c6b;
      --rose: #fff1f4;
      --cream: #fffaf7;
      --brown: #3d2925;
      --muted: #7b6863;
      --line: #eadbd4;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fff7f4, #fff1f4 45%, #fffaf7);
      color: var(--brown);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .auth-box {
      width: min(440px, 100%);
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 55px rgba(61, 41, 37, 0.12);
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(90deg, #3d2925, #6d3e48);
      color: #fff;
      padding: 22px 24px;
    }
    .auth-header h1 {
      margin: 0;
      font-size: 2rem;
      font-family: Georgia, serif;
    }
    .auth-header p {
      margin: 8px 0 0;
      opacity: 0.8;
      font-size: 0.9rem;
    }
    .auth-body {
      padding: 26px 24px 22px;
    }
    .switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
      background: #fff8f7;
    }
    .switch a {
      display: block;
      padding: 12px 10px;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
    }
    .switch a.active {
      background: var(--pink);
      color: #fff;
    }
    form {
      display: grid;
      gap: 16px;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    .field label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      outline: none;
      background: #fff;
    }
    .field input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(232,111,143,0.12);
    }
    .submit {
      border: 0;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      font-weight: 800;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .submit:hover {
      transform: translateY(-1px);
    }
    .error {
      background: #fff0f4;
      color: var(--pink-dark);
      border: 1px solid #f3bfd0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .muted {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="auth-header">
      <h1>Admin Access</h1>
      <p>Only approved staff can open the dashboard</p>
    </div>
    <div class="auth-body">
      <div class="switch">
        <a href="{% url 'admin_login' %}" class="{% if mode == 'login' %}active{% endif %}">Sign In</a>
        <a href="{% url 'admin_signup' %}" class="{% if mode == 'signup' %}active{% endif %}">Sign Up</a>
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      {% if mode == 'login' %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="auth_action" value="login">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
          </div>
          <button class="submit" type="submit">Admin Sign In</button>
        </form>
      {% else %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="auth_action" value="signup">
          <div class="field">
            <label for="username">Admin username</label>
            <input id="username" name="username" type="text" required>
          </div>
          <div class="field">
            <label for="password1">Password</label>
            <input id="password1" name="password1" type="password" minlength="8" required>
          </div>
          <div class="field">
            <label for="password2">Confirm password</label>
            <input id="password2" name="password2" type="password" minlength="8" required>
          </div>
          <button class="submit" type="submit">Create Admin Account</button>
        </form>
      {% endif %}

      <div class="muted">Use this page to access the admin dashboard only.</div>
    </div>
  </div>
</body>
</html>
